name: Build iOS App (bad_query)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA / App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version


      - name: Build Xcode Project
        run: |
          xcodebuild -project bad_query.xcodeproj -list
          xcodebuild build \
            -project bad_query.xcodeproj \
            -target bad_query \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SYMROOT=build

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          find build -name "bad_query.app" -type d -exec cp -r {} Payload/ \;
          zip -r bad_query.ipa Payload


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-ipa
          path: bad_query.ipa
          if-no-files-found: error

