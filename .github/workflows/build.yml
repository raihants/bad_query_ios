name: Build iOS App (bad_query)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA / App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project
        run: |
          xcodebuild archive \
            -project bad_query.xcodeproj \
            -scheme bad_query \
            -destination 'generic/platform=iOS' \
            -archivePath build/bad_query.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/bad_query.xcarchive/Products/Applications/bad_query.app Payload/
          zip -r bad_query.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-ipa
          path: bad_query.ipa
          if-no-files-found: error

